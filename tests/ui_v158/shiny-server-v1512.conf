# 言出法随 —— 线上 shiny-server 配置（V15.12 起）
#
# 这份文件是 /etc/shiny-server/shiny-server.conf 的**完整副本**，只多了一行
# `sockjs_heartbeat_delay 180;`。放在仓库里是为了两件事：
#   ① 让"服务器上还有这么一处配置"跟着代码一起被看见、被评审、被归档；
#   ② 重装/换机器的时候照抄这一份，而不是凭记忆改。
#
# ★★ 为什么必须有这一行（不是调优，是修 bug）
#
#   SockJS 的 websocket 通道上，服务端每 `sockjs_heartbeat_delay` 秒发一个
#   WebSocket 协议级 PING（默认 25 秒），**10 秒**内收不到 pong 就
#   `session.close(3000, 'No response from heartbeat')`。这个 10 秒是写死在
#   sockjs/lib/trans-websocket.js:144-159 里的，配置改不了；RStudio 自己的
#   规则文件里也承认这件事：
#       「...that transport protocol has an effective 10 second limit built in.」
#       （/opt/shiny-server/config/shiny-server-rules.config:173，讲
#         sockjs_disconnect_delay 那一条）
#
#   PING 和业务数据**走同一条 TCP 连接**，所以 PING 是**排在积压数据后面**的：
#   队列里还有 Q 字节、链路速率 R，pong 就要晚 Q/R 秒到。判死的条件因此是
#      一包字节数 P  >  R × (心跳周期 + 10)
#
#   2026-10-03 线上取证（uid=1 / wchcpu2019@163.com，客户端 222.190.61.36）：
#     · 那一段链路实测 **中位数 3.65 KB/s**（/proc/net/tcp 上 Send-Q 的排水
#       速率，峰值 37.6 KB/s）；
#     · 每次断线时 Send-Q 上还压着 **51,800 ~ 67,200 字节**，紧接着源端口
#       就换了（= 连接被服务端关掉、浏览器重连）；
#     · 首屏一包 ≈152 KB（修完管理员那几页之后 ≈116 KB）+ 历史窗口。
#   25 秒的 PING 撞上 116 KB 的积压 → pong 要等 32 秒 → 10 秒判死 →
#   close(3000) → 页面重载 → 再发一遍 → 死循环（auth.log 里 15:49→16:51 没停过）。
#
#   为什么是 **180** 秒，不是 25 也不是 120：
#     判死线 = 3.65 KB/s × (180 + 10) ≈ **694 KB**。
#     实测**今天最重的一屏** = 外壳 115 KB + 自动打开那个会话的窗口
#     （uid=11 那个正在写的长对话，末尾两条一条 257 KB 一条很小）= **368 KB**
#     → 余量 **1.9 倍**。（120 秒只有 474 KB，余量 1.29 倍 —— 那条对话再长
#     一条巨回复就贴线了，所以没停在 120。）
#     反过来说，这个数也保证了**链路慢到 2 KB/s** 时今天这一屏还活得下来。
#
# ⚠️ 但它**不是**对任意大的一包都成立。窗口里"最末尾两条永远渲染"那条规则
#   （DSAPP_HIST_FLOOR_MSG，见 R/config.R）是免预算的，所以理论上最坏的一屏
#   可以是"两条各 384 KB 的巨回复 + 外壳" ≈ 880 KB —— 那个已经超出 180 秒
#   能兜住的范围（要 240 秒以上才够，而 240 秒会让死连接多占 worker 一分多钟）。
#   **真正的解法是给单条消息的渲染封顶（超长就折叠、点开再取）**，那是产品
#   改动，还没做。在那之前：如果哪天又看到某个号循环重载，先量它的首屏字节数，
#   再决定是抬这一行还是去做那个封顶。
#
# ⚠️ 代价（知情选择，不是没想到）：连接已经死掉的客户端，服务端要
#   180+10 秒才发现（原来是 25+10 秒）。这段时间它的 R worker / session 会
#   多留一会儿。本机现在是个位数并发、worker 很轻，这个代价可以接受；
#   **哪天并发上去了、或者要跑很重的会话，回来重新权衡这一行。**
#   另一半原因见 DEPLOYMENT.md「慢链路」那一节：光靠客户端自愈/刹车治不了
#   根，根在服务端这条判据比链路快。

# Instruct Shiny Server to run applications as the user "shiny"
run_as shiny;

# ★ V15.12：SockJS 心跳 25 秒 → 180 秒。理由见文件头。**必须在顶层**
#   （config-router.js:123 是拿根节点 getOne 取的，getOne 只找直接子节点）。
sockjs_heartbeat_delay 180;

# Define a server that listens on port 3838
server {
  listen 34038;

  # Define a location at the base URL
  location / {

    # Host the directory of Shiny Apps stored in this directory
    site_dir /srv/shiny-server;

    # Log all Shiny output to files in this directory
    log_dir /var/log/shiny-server;

    # When a user visits the base URL rather than a particular application,
    # an index of the applications available in this directory will be shown.
    directory_index on;
  }
}
