<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="wfTitle wfDesc" font-family="Noto Sans SC, Source Han Sans SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <title id="wfTitle">YCFS_APP 工作流程</title>
  <desc id="wfDesc">一句话需求、规划、执行 R/Python、产物、追问与返修、导出交付，全部在同一个对话里完成。</desc>
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <radialGradient id="wfGlowA" cx="0.08" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wfGlowB" cx="0.95" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="wfDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.15" fill="#30363d" opacity="0.55"/>
    </pattern>
    <style>
      .wf-title { fill: #e6edf3; font-size: 40px; font-weight: 700; letter-spacing: 0.5px; }
      .wf-sub { fill: #8b949e; font-size: 17px; }
      .wf-badge { fill: #2dd4bf; font-size: 13px; font-weight: 600; letter-spacing: 2px; }
      .wf-card-title { fill: #e6edf3; font-size: 20px; font-weight: 700; }
      .wf-card-sub { fill: #8b949e; font-size: 12.5px; }
      .wf-num { fill: #2dd4bf; opacity: 0.16; font-size: 30px; font-weight: 700; }
      .wf-foot { fill: #8b949e; font-size: 14px; letter-spacing: 0.5px; }
      .wf-ico { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="500" fill="url(#wfBg)"/>
  <rect width="1600" height="500" fill="url(#wfDots)"/>
  <rect width="1600" height="500" fill="url(#wfGlowA)"/>
  <rect width="1600" height="500" fill="url(#wfGlowB)"/>

  <g>
    <rect x="60" y="52" width="196" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="158" y="71" text-anchor="middle" class="wf-badge">YCFS_APP · 工作流程</text>
    <text x="60" y="126" class="wf-title">一句话，跑完整个分析</text>
    <text x="60" y="160" class="wf-sub">需求、执行、产物、返修、交付，都在同一个对话里完成</text>
    <text x="1540" y="126" text-anchor="end" fill="#8b949e" font-size="14">从需求到交付</text>
  </g>

  <!-- 01 一句话需求 -->
  <g>
    <rect x="60" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M76 214 H249" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="243" y="262" text-anchor="end" class="wf-num">01</text>
    <path d="M86 241 h28 a7 7 0 0 1 7 7 v15 a7 7 0 0 1 -7 7 h-16 l-8 7 v-7 h-4 a7 7 0 0 1 -7 -7 v-15 a7 7 0 0 1 7 -7 z" class="wf-ico"/>
    <path d="M92 253 h16 M92 260 h11" class="wf-ico" stroke-opacity="0.55"/>
    <text x="82" y="326" class="wf-card-title">一句话需求</text>
    <text x="82" y="356" class="wf-card-sub">说清目标、数据</text>
    <text x="82" y="377" class="wf-card-sub">和想要的产出</text>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M273 307 H300"/>
    <path d="M294 301 l7 6 -7 6"/>
  </g>

  <!-- 02 规划 -->
  <g>
    <rect x="315" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M331 214 H504" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="498" y="262" text-anchor="end" class="wf-num">02</text>
    <rect x="340" y="244" width="34" height="40" rx="5" class="wf-ico"/>
    <path d="M349 238 h16 v7 h-16 z" class="wf-ico"/>
    <path d="M348 258 l5 5 9 -10 M348 270 h18" class="wf-ico" stroke-opacity="0.75"/>
    <text x="337" y="326" class="wf-card-title">规划</text>
    <text x="337" y="356" class="wf-card-sub">拆步骤、选方法、</text>
    <text x="337" y="377" class="wf-card-sub">确定输入与检查点</text>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M528 307 H555"/>
    <path d="M549 301 l7 6 -7 6"/>
  </g>

  <!-- 03 执行 -->
  <g>
    <rect x="570" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M586 214 H759" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="753" y="262" text-anchor="end" class="wf-num">03</text>
    <rect x="594" y="242" width="38" height="32" rx="5" class="wf-ico"/>
    <path d="M601 252 l6 6 -6 6 M612 265 h8" class="wf-ico" stroke-opacity="0.8"/>
    <text x="592" y="326" class="wf-card-title">执行 R / Python</text>
    <text x="592" y="356" class="wf-card-sub">真的运行、读报错、</text>
    <text x="592" y="377" class="wf-card-sub">自己改代码再跑</text>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M783 307 H810"/>
    <path d="M804 301 l7 6 -7 6"/>
  </g>

  <!-- 04 产物 -->
  <g>
    <rect x="825" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M841 214 H1014" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="1008" y="262" text-anchor="end" class="wf-num">04</text>
    <path d="M850 242 v32 h38" class="wf-ico"/>
    <path d="M858 266 v-10 M866 266 v-18 M874 266 v-14" class="wf-ico" stroke-width="3" stroke-opacity="0.85"/>
    <text x="847" y="326" class="wf-card-title">产物</text>
    <text x="847" y="356" class="wf-card-sub">图、表、报告</text>
    <text x="847" y="377" class="wf-card-sub">都落在工作区</text>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M1038 307 H1065"/>
    <path d="M1059 301 l7 6 -7 6"/>
  </g>

  <!-- 05 追问与返修 -->
  <g>
    <rect x="1080" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M1096 214 H1269" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="1263" y="262" text-anchor="end" class="wf-num">05</text>
    <rect x="1106" y="242" width="34" height="28" rx="3" class="wf-ico" stroke-dasharray="5 4"/>
    <path d="M1121 236 l5 5 -5 5 M1118 248 l6 6" class="wf-ico" stroke-opacity="0.8"/>
    <text x="1102" y="326" class="wf-card-title">追问与返修</text>
    <text x="1102" y="356" class="wf-card-sub">框选或追问，</text>
    <text x="1102" y="377" class="wf-card-sub">指哪改哪、可回退</text>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M1293 307 H1320"/>
    <path d="M1314 301 l7 6 -7 6"/>
  </g>

  <!-- 06 导出交付 -->
  <g>
    <rect x="1335" y="214" width="205" height="186" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M1351 214 H1524" stroke="url(#wfAccent)" stroke-width="3" stroke-linecap="round"/>
    <text x="1518" y="262" text-anchor="end" class="wf-num">06</text>
    <path d="M1360 250 h38 v26 h-38 z" class="wf-ico"/>
    <path d="M1379 232 v24 M1372 240 l7 -8 7 8" class="wf-ico" stroke-opacity="0.85"/>
    <text x="1357" y="326" class="wf-card-title">导出交付</text>
    <text x="1357" y="356" class="wf-card-sub">单件下载，或</text>
    <text x="1357" y="377" class="wf-card-sub">整包带走复现</text>
  </g>

  <path d="M60 430 H1540" stroke="#21262d" stroke-width="1"/>
  <g fill="#8b949e" font-size="14">
    <text x="800" y="462" text-anchor="middle">同一个对话 · 过程可回看 · 结果可返修 · 交付可复现</text>
  </g>
</svg>
