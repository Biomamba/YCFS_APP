# =============================================================================
# 桌面版打包（Windows / macOS）
# =============================================================================
#
# 为什么会有这个文件（2026-10-07）：
#
#   打包机是 Linux，两件事在那台机器上做不了 ——
#     · Windows 单文件 exe：交叉编译要 wine（electron-builder 往 exe 里塞图标
#       和版本信息用的是 rcedit，那是个 Windows 程序），而 conda-forge 的
#       linux-64 没有 wine。**这是当时唯一的拦路虎。**
#     · macOS 单文件：electron-builder 在非 macOS 上直接拒绝出 mac 目标
#       （dmg 要 hdiutil、签名要 codesign，都是系统自带、没有替代实现）。
#
#   想用虚拟机绕：不行。那台机器 `/dev/kvm` 不存在（没有硬件虚拟化），
#   qemu 没装（装要 sudo 而 sudo 要密码），docker 的 socket 也连不上。
#   而且就算都能解决，macOS 按 Apple 的 EULA 只能跑在 Apple 硬件上。
#
#   所以走 GitHub Actions：**给的是真的 Windows 和真的 Mac**，
#   windows-latest 上原生打包不需要 wine，macos-14 是 Apple 芯片、
#   macos-15-intel 是 Intel（原来是 macos-13，它 2025-12-04 已停用 ——
#   见下面 mac-bundle 那节的注释，那种 job 是"永远排队"而不是"报错"）。
#   仓库是 public ⇒ 标准 runner 不计费。
#
# ---- ⚠️ 这个 workflow 还没跑通过 ---------------------------------------------
#
#   第一版的定位是**探路**：`shinyelectron` 在 mac 上到底吐出什么
#   （.dmg？.zip？裸 .app？）、bundled 策略在 CI 里下不下得动便携 R，
#   这些本地一条都验不了。所以每个 job 都 `fail-fast: false`，
#   一个平台挂了不影响另外几个，挂了就看它那一段日志。
#
# ---- R 版本必须钉 4.4.x ------------------------------------------------------
#
#   `desktop/build_bytecode.R` 会把 app.R + R/*.R 编成字节码（app.rds/lib.rds），
#   **用的是打包机上这份 R**；而运行时是包里自带的便携 R 4.4.3。
#   两边 minor 必须一致（`run_local.R` 的加载器会拿它对指纹）。
#   ⇒ 钉 4.4.3，别写 'release'（那会拿到 4.5.x，打出来的字节码运行时读不了）。
#
#   ⚠️ 但 minor 一致就够了，patch 不用相等：打包机 4.4.2 配运行时 4.4.3 是
#     验证过的组合（见 desktop/README.md 第五节）。
# =============================================================================

name: desktop

on:
  # 手动触发。**默认不自动跑** —— 打包要十几分钟、产物几百 MB，
  # 不该每次 push 都来一遍。
  workflow_dispatch:
    inputs:
      release_tag:
        description: '打完后发 Release 用的标签（如 v16.11）。留空则只上传 artifact，不建 Release。'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# 默认 token 是只读的；发 Release 要写权限。不用 PAT —— 这是仓库自己的
# GITHUB_TOKEN，作用域就限在这个仓库。
permissions:
  contents: write

env:
  # 便携 R 的版本，和 desktop/build_windows_bundle.sh / build_macos_bundle.sh
  # 里的 DSAPP_RUNTIME_RVER 默认值保持一致。
  R_VERSION: '4.4.3'

jobs:
  # ---------------------------------------------------------------------------
  # Windows 免安装 zip
  # ---------------------------------------------------------------------------
  # 跑在 ubuntu 上：这个脚本全程只是下载 + 解压 + 打 zip，**不需要 Windows**
  # （R 运行时和 R 包都是现成的 Windows 二进制）。ubuntu 上有原生 bash/zip，
  # 比在 windows runner 上凑 Git Bash 省事得多。
  win-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: 组装
        run: bash desktop/build_windows_bundle.sh out

      - name: 列出产出
        run: ls -la out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win-bundle
          path: out/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows 单文件 exe
  # ---------------------------------------------------------------------------
  # ★ 这条路就是当初那台 Linux 上打不出来的那条。在真 Windows 上，
  #   electron-builder 用它自己的工具往 exe 里写资源，不需要 wine。
  win-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # shinyelectron 0.2.1 要求 Node >= 22、npm >= 11.5（它 DESCRIPTION 里的
      # SystemRequirements）。runner 上预装的那份不一定够新，钉死。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠️⚠️ Node 22 自带的是 **npm 10.x**，而 shinyelectron 要 npm >= 11.5
      #     （npm 11 是跟着 Node 24 发的，不是 22）。2026-10-07 第一次跑 CI
      #     实测：node 22.23.2 配 npm 10.9.8，build_exe.R 的 preflight 当场
      #     拒绝、打包这一步一秒没过。**光装 Node 22 是不够的。**
      - name: 把 npm 升到 11
        shell: bash
        run: |
          npm install -g npm@11 || npm install -g npm@11 --force
          npm --version

      # ⚠️⚠️ **必须连 renv 一起装**，这不是"顺手多装一个"。2026-10-07 实测：
      #    只装 shinyelectron 的话，再往下走一步就死在
      #        ℹ Preparing application files...
      #        打包失败：there is no package called 'rlang'
      #
      #    这条链有三跳，每一跳单看都很合理，所以不看源码根本猜不到：
      #      ① shinyelectron 用 `renv::dependencies()` 扫应用源码，推断出
      #         "这个 app 要哪些 R 包" —— 而 `runtime_strategy: bundled` 正是
      #         照这份清单往便携 R 里装包。**没有它，打出来的包能打开、一用
      #         就废**（依赖一个都没有），所以它把 renv 放在 Suggests 里但
      #         当作硬依赖用。
      #      ② renv 没装 → `requireNamespace("renv")` 为 FALSE →
      #         走 `cli::cli_abort()`。
      #      ③ 而 **`cli::cli_abort()` 的实现里直接写着 `rlang::abort(...)`**
      #         （rlang 只是 cli 的 Suggests，cli 的 Imports 里没有它）⇒
      #         真正没装的是 rlang，报出来的也是 rlang。
      #    ⇒ 所以"装了 shinyelectron 却报 rlang 找不到"是正常的，
      #      两个包都得装。
      #
      #    ⚠️ 还有第三个：**withr**。同一个坑的另一个入口 ——
      #      `shinyelectron::run_command_safe()` 第一句就是
      #      `withr::local_tempdir()`，而整个函数体包在 tryCatch 里 ⇒ 缺 withr
      #      时抛的"没有这个包"被 error= 处理器吞掉、统一成 `status = 1L`，
      #      调用方（validate_node_npm）只能得出"命令没跑成"，于是报
      #         ✖ Error: Node.js is required but not found
      #      —— **而 node 就在 PATH 上**（实测 2026-10-07：preflight 都把
      #      22.23.2 的绝对路径打出来了，下一步照样说 not found）。照那句英文
      #      去查 Node 是死胡同。
      #    ⇒ renv / rlang / withr 三个一起装。build_exe.R 的 preflight 现在
      #      也会在开工前一秒拦这一条，报清楚缺哪个（不再等十分钟看假英文）。
      - name: 装 shinyelectron + renv + rlang + withr
        shell: Rscript {0}
        run: install.packages(c("shinyelectron", "renv", "rlang", "withr"), repos = "https://cloud.r-project.org")

      - name: 报环境（出问题时有据可查）
        shell: bash
        run: |
          node --version; npm --version
          Rscript --no-environ -e 'cat(R.version.string, "\n")'
          # 上面那条链再断一次的话，这一行会直接把断点打出来
          Rscript --no-environ -e 'for (p in c("renv","rlang","withr")) cat(p, ":", requireNamespace(p, quietly=TRUE), " ")'; echo

      # ★ 打包前先跑一遍 build_exe.R 里那两段逻辑的测试（本地假归档，不联网，
      #   几秒钟）。为什么值这一步：seed_portable_r 存在的唯一理由就是绕开
      #   shinyelectron 在 R 4.4.x 上"便携 R 校验必失败"那个 bug ——
      #   **绕法失效的症状是这里再报一次那句看不懂的 checksum 错**，
      #   而不是别的什么明显的东西，所以在下载 100 MB 之前先验一遍。
      #   ⚠️ Windows 上尤其要看：sha256_of 最没把握的就是 certutil 的排版
      #   （本机是 Linux，conda 那份 certutil 是 NSS 的，跟 Windows 自带的不
      #   是一个程序；这一段是整套测试里唯一在 Windows 上有覆盖的地方）。
      - name: 测预置便携 R 的逻辑（不联网）
        shell: bash
        run: Rscript --no-environ desktop/tests/seed_portable_r.R

      - name: 打包
        shell: bash
        run: Rscript --no-environ desktop/build_exe.R --plat=win --arch=x64 out

      - name: 列出产出
        shell: bash
        run: find out -maxdepth 3 -type f \( -name '*.exe' -o -name '*.zip' \) -exec ls -la {} +

      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          # ⚠️ 这里**故意不写 if-no-files-found: error**：第一次跑就是在探
          #    shinyelectron 到底往哪儿吐产物（可能在 exe_out/ 下再套一层）。
          #    找不到东西时 build_exe.R 自己会 exit 1，用不着这一条兜。
          path: |
            out/**/*.exe
            out/**/*.zip

  # ---------------------------------------------------------------------------
  # macOS 免安装 zip（两个架构各一份）
  # ---------------------------------------------------------------------------
  # ⚠️ **架构必须在真机上打**：arm64 和 x86_64 是两份不同的 CRAN 仓库，
  #    拿错的表现是用户那边一 library() 报 "incompatible architecture"。
  #    在对应的宿主上跑，自检里的"验回 zip 解出来符号链接还在不在"才有意义。
  mac-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple 芯片（M 系）
            arch: arm64
          # ⚠️⚠️ 这里原来是 macos-13。**macos-13 已于 2025-12-04 停用**，
          #    而用它写的 job **不会报错、只会永远 queued** —— 实测：从创建
          #    那一刻起一直 queued，日志一个字都没有。这种"没有失败的失败"
          #    最容易被读成"还在排队"，其实是没有这种机器了。
          #    Intel 的标准 runner 现在叫 macos-15-intel，公开仓库照样免费。
          # ⚠️ 但它是过渡品：Apple 已停掉 x86_64，GitHub 明说 macOS 15 镜像
          #    2027 年秋退役后就不再提供任何 Intel runner。到时候要么
          #    放弃 Intel Mac，要么只剩付费的 -large。
          - runner: macos-15-intel  # Intel x86_64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # ⚠️ 已结案（2026-10-07），别再重查一遍。
      #
      #   起因：mac-bundle 连着几轮死在同一行（build_macos_bundle.sh:135）：
      #       Rscript --no-environ -e 'cat(paste0(R.version$major, ".", sub("\\..*$", ...)))'
      #     报 `Error: '\\.' is an unrecognized escape ... (<input>:1:40)`。
      #
      #   当时在**这个 job 里**跑了一次对照实验（同一段代码、同一个 bash、
      #   同一个 R，只换投递方式），结论是：
      #
      #     · 走**文件**（heredoc 带引号写 /tmp/t.R，`od -c` 看得到文件里
      #       确实是两个反斜杠）→ `nchar("\\.")` = 2、`sub("\\..*$","","4.4.3")` = "4"，**正常**；
      #     · 走 **-e**（同一段代码，直接写在步骤脚本里，不是从仓库里读的）
      #       → `Error: '\\.' is an unrecognized escape ... (<input>:1:31)`，**失败**。
      #
      #   列号是判据：R 报的是"转义符后面那个字符"的位置（本机实测
      #   `cat(nchar("\."))` 里 `\` 在第 12 列、`.` 在第 13 列，R 报 1:13）。
      #   runner 报 1:31，而源码里那两个反斜杠在第 30、31 列 ——
      #   **说明 R 收到的是一个反斜杠，且前面每个字符都对得上**。
      #
      #   ⇒ 结论：**这台 macOS runner 上，`Rscript -e` 这条路会吃掉一层反斜杠；
      #     写成文件走 `Rscript <file>` 不会。** 不是我们的引号写错，
      #     不是 YAML 吃了，也不是仓库里的文件不对（那三样当时都排除了）。
      #     机制没查到（`/usr/local/bin/Rscript` 是指向 Mach-O 二进制的符号链接，
      #     不是 shell 包装器，所以"包装器重复解析一遍"这个解释不成立）——
      #     但它可复现，而且够用了。
      #
      #   ⇒ 规矩：**别在 `Rscript -e` 里写任何反斜杠转义**（正则、`\n`、`\t`）。
      #     要正则就写成字符类（`[.]` 而不是 `\\.`），或者干脆落成一个文件再跑。
      #     build_macos_bundle.sh / build_windows_bundle.sh 里那两句
      #     `sub("[.].*$", ...)` 就是照这条改的 —— 别再"顺手改回 `\\.`"。
      #     复查办法（*_common.py 里那些是文档里的例子，不是调用点，别被 grep 骗了）：
      #       grep -rn "Rscript.*-e " desktop/ deploy.sh tests/err_guard/ .github/
      #     真正的调用点只有 desktop/ 两个脚本 + 本工作流 + tests/err_guard/run.sh。

      - name: 组装（${{ matrix.arch }}）
        run: bash desktop/build_macos_bundle.sh out ${{ matrix.arch }}

      - name: 列出产出
        run: ls -la out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-bundle-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS 单文件（.app / .dmg）
  # ---------------------------------------------------------------------------
  # ★ 这条路是原来"需要一台 Mac"的那条。现在这台 Mac 是 macos-14/13。
  mac-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple 芯片（M 系）
            arch: arm64
          # ⚠️ macos-13 已停用（2025-12-04），用它写的 job 只会永远 queued、
          #    不报错。Intel 现在的标准 runner 是 macos-15-intel。
          #    详见 mac-bundle 那一节的注释。
          - runner: macos-15-intel  # Intel x86_64
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 同上：Node 22 自带的 npm 是 10.x，要 >= 11.5。
      - name: 把 npm 升到 11
        run: |
          npm install -g npm@11 || npm install -g npm@11 --force
          npm --version

      # ⚠️ renv + rlang + withr 必须一起装，理由见 win-exe 那一段的长注释
      #    （2026-10-07 实测：只装 shinyelectron 会死在
      #     "打包失败：there is no package called 'rlang'"；
      #     补上 rlang 之后又死在 withr —— 报的是
      #     "Node.js is required but not found"，跟真实原因毫无关系）。
      - name: 装 shinyelectron + renv + rlang + withr
        run: |
          Rscript --no-environ -e 'install.packages(c("shinyelectron", "renv", "rlang", "withr"), repos = "https://cloud.r-project.org")'
          Rscript --no-environ -e 'for (p in c("renv","rlang","withr")) cat(p, ":", requireNamespace(p, quietly=TRUE), " ")'; echo

      # .icns 只能在 macOS 上生成（sips + iconutil 都是系统自带的）。
      # 仓库里因此只放源图 desktop/app.png（1024×1024），图标在这里现做。
      - name: 生成 app.icns
        run: bash desktop/make_icns.sh

      - name: 报环境
        run: |
          uname -m; node --version; npm --version
          Rscript --no-environ -e 'cat(R.version.string, "\n")'

      # ⚠️ 不签名的话，Apple 芯片上的 app 会被 Gatekeeper 直接判「已损坏」
      #    （arm64 的二进制**必须**至少有一个签名，哪怕是临时的）。
      #    electron-builder 找不到 Developer ID 时不一定替我们 ad-hoc 签，
      #    所以自己来。正式的 Developer ID 签名 + 公证要 99 美元/年的账号，
      #    那是另一件事。
      # ★ 同 win-exe：打包前先验 build_exe.R 里那两段逻辑（不联网，几秒钟）。
      - name: 测预置便携 R 的逻辑（不联网）
        run: Rscript --no-environ desktop/tests/seed_portable_r.R

      - name: 打包
        run: Rscript --no-environ desktop/build_exe.R --plat=mac --arch=${{ matrix.arch }} out

      - name: ad-hoc 签名（没有 Developer ID 时的最低要求）
        run: |
          set -x
          find out -maxdepth 4 -name '*.app' -print0 |
            while IFS= read -r -d '' app; do
              codesign --force --deep --sign - "$app" || echo "（签名失败，继续 —— 先看看产物长什么样）"
              codesign -dv --verbose=2 "$app" 2>&1 | head -20
            done

      - name: 列出产出
        run: find out -maxdepth 4 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.app' \) -exec ls -ld {} +

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app-${{ matrix.arch }}
          # 同上：第一次跑是探路，产物叫什么名字还不知道。
          path: |
            out/**/*.dmg
            out/**/*.zip
            out/**/*.app

  # ---------------------------------------------------------------------------
  # 汇总发 Release
  # ---------------------------------------------------------------------------
  # ⚠️ 为什么走 Release 而不是只用 artifact：**artifact 要登录才能下**
  #    （公开仓库也一样），而 Release 附件是公开的。用户拿到的是链接，
  #    不该为了下载还得先有个 GitHub 账号。
  #
  #    另外 artifact 是过一次 zip 的，mac 包里那 19 个符号链接会怎样不好说；
  #    Release 附件是**原样上传、原样下载**，不经过第二层压缩。
  release:
    needs: [win-bundle, win-exe, mac-bundle, mac-app]
    # 手动触发时：给了 release_tag 才发。tag 推送时：总发。
    if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 摊平 + 出校验和
        run: |
          mkdir -p flat
          find dist -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp -v {} flat/ \;
          cd flat && sha256sum * | tee SHA256SUMS.txt
          echo "---"; ls -la

      - name: 标签
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          # 已存在就更新，别因为重跑一次就报"标签已存在"失败。
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            桌面版打包产物（由 GitHub Actions 在本仓库源码上构建）。

            | 文件 | 给谁 |
            |---|---|
            | `DS_App-Windows-*.zip` | Windows，解压后双击 `run_app.bat` |
            | `*.exe` | Windows 单文件 |
            | `DS_App-macOS-arm64-*.zip` | Mac（Apple 芯片 M1/M2/M3/M4） |
            | `DS_App-macOS-x86_64-*.zip` | Mac（Intel） |
            | `*.dmg` | Mac 单文件 |

            ⚠️ 没有代码签名证书：Windows 上会弹「未知发布者」，macOS 上首次打开
